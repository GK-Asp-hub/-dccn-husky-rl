<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <marker id="arrow_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f77b4"/>
    </marker>
    <marker id="arrow_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff7f0e"/>
    </marker>
    <marker id="arrow_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2ca02c"/>
    </marker>
  </defs>

  <style>
    .layer   { stroke:#333; stroke-width:1.5; }
    .label   { font-size:14px; fill:#111; }
    .sub     { font-size:11px; fill:#444; font-style:italic; }
    .title   { font-size:16px; font-weight:bold; fill:#111; }
    .edge    { stroke:#333; stroke-width:1.5; fill:none; }
    .edge_b  { stroke:#1f77b4; stroke-width:2; fill:none; }
    .edge_o  { stroke:#ff7f0e; stroke-width:2; fill:none; }
    .edge_g  { stroke:#2ca02c; stroke-width:2; fill:none; }
    .note    { font-size:11px; fill:#666; }
  </style>

  <!-- ======================= ENV ======================= -->
  <rect x="20" y="60" width="180" height="400" rx="10" fill="#f5f5f5" class="layer"/>
  <text x="110" y="85" text-anchor="middle" class="title">Среда</text>
  <text x="110" y="102" text-anchor="middle" class="sub">PyBullet + Husky</text>

  <!-- Observation box (output of env) -->
  <rect x="40" y="130" width="140" height="120" rx="6" fill="#fff" class="layer"/>
  <text x="110" y="150" text-anchor="middle" class="label" font-weight="bold">Observation</text>
  <text x="50" y="172" class="label">x, y, v, ω</text>
  <text x="50" y="190" class="label">cos ψ, sin ψ</text>
  <text x="50" y="208" class="label">goal_dx, goal_dy</text>
  <text x="50" y="228" class="label" fill="#8a6900">lidar[0..15]</text>
  <text x="50" y="244" class="note">(только Stage 2a)</text>

  <!-- Action box (input to env) -->
  <rect x="40" y="310" width="140" height="90" rx="6" fill="#fff" class="layer"/>
  <text x="110" y="330" text-anchor="middle" class="label" font-weight="bold">Action</text>
  <text x="110" y="355" text-anchor="middle" class="label">a = [v_L, v_R]</text>
  <text x="110" y="375" text-anchor="middle" class="sub">diff-drive, 2D</text>

  <!-- ======================= Planner ======================= -->
  <rect x="260" y="60" width="220" height="100" rx="10" fill="#e7f5ea" class="layer" stroke="#2ca02c"/>
  <text x="370" y="88" text-anchor="middle" class="title">Waypoint-планировщик</text>
  <text x="370" y="108" text-anchor="middle" class="sub">детерминированный, N точек</text>
  <text x="370" y="128" text-anchor="middle" class="label">w_i = p₀ + (i/N)·(p_g − p₀)</text>
  <text x="370" y="148" text-anchor="middle" class="note">switch_radius = 0.8 м</text>

  <!-- goal_vec override arrow — планировщик меняет goal в obs -->
  <path d="M 260 120 Q 220 120 190 155" class="edge_g" marker-end="url(#arrow_green)"/>
  <text x="195" y="135" class="note" fill="#2ca02c">подменяет goal_vec</text>

  <!-- ======================= TD3 ======================= -->
  <rect x="260" y="200" width="220" height="110" rx="10" fill="#eaf1fa" class="layer" stroke="#1f77b4"/>
  <text x="370" y="228" text-anchor="middle" class="title">TD3 reactive policy</text>
  <text x="370" y="248" text-anchor="middle" class="sub">нейросетевая, обученная off-policy</text>
  <text x="370" y="272" text-anchor="middle" class="label">π_θ: obs → a_TD3</text>
  <text x="370" y="292" text-anchor="middle" class="note">stable-baselines3 TD3</text>

  <!-- obs → TD3 -->
  <path d="M 180 190 L 255 240" class="edge_b" marker-end="url(#arrow_blue)"/>
  <text x="205" y="220" class="note" fill="#1f77b4" transform="rotate(27 205 220)">obs</text>

  <!-- ======================= LQR ======================= -->
  <rect x="260" y="340" width="220" height="100" rx="10" fill="#fdf0e3" class="layer" stroke="#ff7f0e"/>
  <text x="370" y="368" text-anchor="middle" class="title">LQR residual</text>
  <text x="370" y="388" text-anchor="middle" class="sub">линейный регулятор, аналитическая модель</text>
  <text x="370" y="410" text-anchor="middle" class="label">a_LQR = −K·[y_e, θ_e]ᵀ</text>
  <text x="370" y="428" text-anchor="middle" class="note">Q, R из уравнения Риккати</text>

  <!-- obs → LQR (только pose и goal) -->
  <path d="M 180 190 Q 220 280 255 380" class="edge_o" marker-end="url(#arrow_orange)"/>
  <text x="215" y="330" class="note" fill="#ff7f0e">pose, goal</text>

  <!-- ======================= Combiner ======================= -->
  <rect x="550" y="250" width="180" height="110" rx="10" fill="#fff" class="layer"/>
  <text x="640" y="280" text-anchor="middle" class="title">Combiner</text>
  <text x="640" y="305" text-anchor="middle" class="label">a = (1−α)·a_TD3</text>
  <text x="640" y="325" text-anchor="middle" class="label">+ α · a_LQR</text>
  <text x="640" y="348" text-anchor="middle" class="note">α = 0.2</text>

  <!-- TD3 → combiner -->
  <path d="M 480 255 L 550 285" class="edge_b" marker-end="url(#arrow_blue)"/>
  <text x="495" y="265" class="note" fill="#1f77b4">a_TD3</text>

  <!-- LQR → combiner -->
  <path d="M 480 385 L 550 335" class="edge_o" marker-end="url(#arrow_orange)"/>
  <text x="495" y="380" class="note" fill="#ff7f0e">a_LQR</text>

  <!-- combiner → env (action) -->
  <path d="M 640 360 Q 640 420 190 370" class="edge" marker-end="url(#arrow)"/>
  <text x="420" y="420" class="note">a</text>

  <!-- env obs → planner (planner needs start/goal) -->
  <path d="M 180 145 Q 220 90 260 95" class="edge_g" marker-end="url(#arrow_green)"/>

  <!-- ======================= Legend ======================= -->
  <rect x="550" y="60" width="180" height="160" rx="6" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="640" y="82" text-anchor="middle" class="label" font-weight="bold">Потоки</text>
  <line x1="565" y1="100" x2="600" y2="100" class="edge_g"/>
  <text x="608" y="105" class="note">вмешательство planner</text>
  <line x1="565" y1="122" x2="600" y2="122" class="edge_b"/>
  <text x="608" y="127" class="note">observation → TD3 → a_TD3</text>
  <line x1="565" y1="144" x2="600" y2="144" class="edge_o"/>
  <text x="608" y="149" class="note">pose,goal → LQR → a_LQR</text>
  <line x1="565" y1="166" x2="600" y2="166" class="edge"/>
  <text x="608" y="171" class="note">финальное действие</text>
  <text x="560" y="195" class="note">Planner отключается</text>
  <text x="560" y="210" class="note">в baseline / TD3+LQR режимах</text>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" class="title" font-size="18">Трёхслойная архитектура управления</text>
  <text x="380" y="50" text-anchor="middle" class="sub">TD3 reactive policy + LQR residual + waypoint-планировщик</text>
</svg>
